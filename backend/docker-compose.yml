services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: parkgrid
      POSTGRES_PASSWORD: parkgrid
      POSTGRES_DB: parkgrid
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkgrid -d parkgrid"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches outgoing mail (password-reset links) at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional: only needed when running >1 backend instance (see docs/REALTIME.md)
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
